<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея фотографий</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="gallery-container">
        <header class="gallery-header">
            <h1 class="gallery-title">Галерея</h1>
            <button class="upload-btn">Загрузить</button>
        </header>

        <main class="gallery-grid">

            <article class="photo-card">
                <img src="img/img1.png" alt="Горное озеро" class="photo-img">
                <div class="photo-info">
                    <h2 class="photo-name">Горное озеро</h2>
                    <p class="photo-date">12 Июня 2026</p>
                </div>
            </article>

            <article class="photo-card">
                <img src="img/img2.png" alt="Ночной город" class="photo-img">
                <div class="photo-info">
                    <h2 class="photo-name">Ночной город</h2>
                    <p class="photo-date">10 Июня 2026</p>
                </div>
            </article>

            <article class="photo-card">
                <img src="img/img3.png" alt="Океанский пляж" class="photo-img">
                <div class="photo-info">
                    <h2 class="photo-name">Океанский пляж</h2>
                    <p class="photo-date">8 Июня 2026</p>
                </div>
            </article>

            <article class="photo-card">
                <img src="img/img4.png" alt="Лесная тропа" class="photo-img">
                <div class="photo-info">
                    <h2 class="photo-name">Лесная тропа</h2>
                    <p class="photo-date">6 Июня 2026</p>
                </div>
            </article>

            <article class="photo-card">
                <img src="img/img5.png" alt="Водопад" class="photo-img">
                <div class="photo-info">
                    <h2 class="photo-name">Водопад</h2>
                    <p class="photo-date">4 Июня 2026</p>
                </div>
            </article>

            <article class="photo-card">
                <img src="img/img6.png" alt="Городские улицы" class="photo-img">
                <div class="photo-info">
                    <h2 class="photo-name">Городские улицы</h2>
                    <p class="photo-date">2 Июня 2026</p>
                </div>
            </article>

        </main>
    </div>

</body>

</html>
